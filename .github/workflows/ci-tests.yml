name: CI - Tests

on:
  push:
    branches: [ main, updates ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest pytest-mock numpy pydantic jsonlines pandas tqdm -q
      - name: Run tests
        run: |
          pytest -q
